name: half-D Android build

on: [push, workflow_dispatch]

env:
  ANDROID_COMMANDLINE_TOOLS_VER: "14742923"
  ANDROID_BUILD_TOOLS_VER: "36.0.0"
  ANDROID_PLATFORM_VER: "android-35"
  ANDROID_NDK_VERSION: "29.0.14206865"
  SDL_VERSION: "2.32.10"
  FFMPEG_VERSION: "9.0"

jobs:
  engine-apk:
    name: Engine fork APK (armv7 + arm64, game libs bundled in arm64)
    runs-on: ubuntu-latest
    needs: game-libs   # game libs are baked into the APK's lib/arm64-v8a
    steps:
    - uses: actions/checkout@v4

    - name: Get game libs from the game-libs job
      uses: actions/download-artifact@v4
      with:
        name: diffusion-android-libs
        path: game-libs

    - name: Bundle game libraries into APK jniLibs (arm64-v8a)
      # ANDROID_LoadLibrary falls back to dlopen(name) = APK nativeLibraryDir,
      # so the game client/server/menu ship inside the APK under the names
      # the engine requests (see docs/PORTING_NOTES.md, "Android library loading")
      run: |
        mkdir -p engine/android/app/src/main/jniLibs/arm64-v8a
        unzip -q game-libs/diffusion-android-aarch64-libs.zip -d gamelibs
        cp gamelibs/diffusion/bin/libserver_android_arm64.so  engine/android/app/src/main/jniLibs/arm64-v8a/
        cp gamelibs/diffusion/bin/libclient_android_arm64.so  engine/android/app/src/main/jniLibs/arm64-v8a/
        cp gamelibs/diffusion/bin/libmenu_android_arm64.so     engine/android/app/src/main/jniLibs/arm64-v8a/libmenu.so
        ls -lh engine/android/app/src/main/jniLibs/arm64-v8a/

    - name: Bundle patched glsl into APK assets (override layer)
      # the engine mounts APK assets a second time as the HIGHEST priority
      # search path (see FS_Rescan in engine/filesystem/searchpath.c), so
      # these shaders override the stale glsl/ in the user's game folder
      run: |
        rm -rf engine/android/app/src/main/assets/glsl
        cp -a game/glsl engine/android/app/src/main/assets/glsl
        ls engine/android/app/src/main/assets/glsl | head -5
        ls engine/android/app/src/main/assets/glsl | wc -l

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'   # for sdkmanager; gradle daemon installs its pinned JBR 21 itself

    - name: Install Android SDK + NDK
      run: |
        SDK_DIR="/usr/local/lib/android/sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        cd "$SDK_DIR"
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMANDLINE_TOOLS_VER}_latest.zip" -O sdk.zip
        unzip -q sdk.zip && mv cmdline-tools cmdtmp && mkdir -p cmdline-tools/tools && mv cmdtmp/* cmdline-tools/tools/
        export ANDROID_HOME="$SDK_DIR" ANDROID_SDK_ROOT="$SDK_DIR"
        export PATH="$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "build-tools;${ANDROID_BUILD_TOOLS_VER}" "platform-tools" "platforms;${ANDROID_PLATFORM_VER}" "ndk;${ANDROID_NDK_VERSION}"

    - name: Fetch SDL2 and FFmpeg prebuilts
      run: |
        cd engine
        mkdir -p 3rdparty/SDL 3rdparty/ffmpeg
        wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O- | tar -xz -C 3rdparty/SDL --strip-components=1
        . scripts/lib.sh
        for ABI in armeabi-v7a:arm32 arm64-v8a:arm64; do
          archive=$(GH_CPU_OS=android GH_CPU_ARCH="${ABI#*:}" FFMPEG_VERSION="${FFMPEG_VERSION}" get_ffmpeg_archive)
          echo "ffmpeg archive: $archive"
          wget -q "https://github.com/FWGS/FFmpeg-Builds/releases/download/latest/${archive}.tar.xz" -O- | tar -xJf - -C 3rdparty/ffmpeg
          mv "3rdparty/ffmpeg/${archive}" "3rdparty/ffmpeg/${ABI%%:*}"
        done

    - name: Init git in engine (gradle reads git hash)
      run: |
        cd engine && git init -q .
        git add -A && git -c user.name=ci -c user.email=ci@half-d.local commit -qm "vendored xash3d-fwgs"

    - name: Ensure cmake and ninja available
      run: |
        cmake --version || { sudo apt-get update && sudo apt-get install -y cmake; }
        ninja --version || sudo apt-get install -y ninja-build || true

    - name: Build APK
      run: |
        export PATH="/usr/local/lib/android/sdk/cmake/3.22.1/bin:$PATH"
        cd engine/android
        ANDROID_HOME="/usr/local/lib/android/sdk" ANDROID_SDK_ROOT="/usr/local/lib/android/sdk" ./gradlew assembleContinuous --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: half-D-engine-apk
        path: engine/android/app/build/outputs/apk/continuous/app-continuous.apk

  game-libs:
    name: Diffusion client/server/mainui (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Android NDK
      run: |
        SDK_DIR="/usr/local/lib/android/sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        cd "$SDK_DIR"
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMANDLINE_TOOLS_VER}_latest.zip" -O sdk.zip
        unzip -q sdk.zip && mv cmdline-tools cmdtmp && mkdir -p cmdline-tools/tools && mv cmdtmp/* cmdline-tools/tools/
        export ANDROID_HOME="$SDK_DIR" ANDROID_SDK_ROOT="$SDK_DIR"
        export PATH="$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platform-tools" "ndk;${ANDROID_NDK_VERSION}"

    - name: Place MainUI subproject
      run: rm -rf game/3rd-party/mainui_cpp && cp -a mainui game/3rd-party/mainui_cpp

    - name: Fetch PhysX SDK
      run: bash scripts/fetch_physx.sh

    - name: Configure (aarch64 Android)
      run: |
        cd game
        export ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}"
        python3 waf configure -T release --disable-werror --android=aarch64,clang,21 --destdir=out

    - name: Build
      run: |
        cd game
        python3 waf build install --destdir=out 2>&1 | tee build.log || { tail -80 build.log; exit 1; }

    - name: Rename libs to engine Android naming (lib prefix)
      # COM_GenerateCommonLibraryName on Android produces lib<name>_android_arm64.so;
      # our v0.1.0 zip shipped client_android_arm64.so etc. and the engine
      # could not find them (device test 2026-11-20, see logs/device-tests/)
      run: |
        cd game/out/diffusion/bin
        # yalnie's tree already installs with the lib- prefix; only rename
        # when the un-prefixed name is present
        for f in client server menu; do
          [ -f "${f}_android_arm64.so" ] && mv "${f}_android_arm64.so" "lib${f}_android_arm64.so" || true
        done
        ls -lh

    - name: Package diffusion android libs
      run: |
        cd game
        find out -type f -name '*.so' -exec ls -lh {} \;
        mkdir -p pkg/diffusion
        cp -a out/diffusion pkg/ 2>/dev/null || true
        cp -a glsl pkg/diffusion/
        # MainUI asks the engine for gfx/fonts/FiraSans-Regular.ttf; the itch
        # package may not ship it, and without it the menu falls back to the
        # engine default font (v0.1.1 device log). FiraSans is SIL OFL.
        mkdir -p pkg/diffusion/gfx/fonts
        cp ../assets/fonts/FiraSans-Regular.ttf pkg/diffusion/gfx/fonts/
        # half-D: the itch package ships gfx/particles/raindrop.dds as BC7
        # SRGB, which Mali cannot decode through gl4es (no BPTC — the device
        # log showed "texture upload failed (format BC7 SRGB)"). It is replaced
        # by the uncompressed DDS built by tools/make_raindrop.py. The other
        # particle DDS (fleck_wood1/fleck_dirt/glass_gib/tile_gib) are missing
        # from the 1.21 data entirely (device log 2026-11-22 02:04) — neutral
        # placeholder chips from tools/make_particle_stubs.py so impact debris
        # renders instead of showing the missing-texture checker.
        mkdir -p pkg/diffusion/gfx/particles
        cp ../assets/particles/*.dds pkg/diffusion/gfx/particles/
        cd pkg && zip -r ../diffusion-android-aarch64-libs.zip diffusion

    - name: Upload game libs artifact
      uses: actions/upload-artifact@v4
      with:
        name: diffusion-android-libs
        path: game/diffusion-android-aarch64-libs.zip
