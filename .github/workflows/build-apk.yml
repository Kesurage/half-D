name: half-D Android build

on: [push, workflow_dispatch]

env:
  ANDROID_COMMANDLINE_TOOLS_VER: "14742923"
  ANDROID_BUILD_TOOLS_VER: "36.0.0"
  ANDROID_PLATFORM_VER: "android-35"
  ANDROID_NDK_VERSION: "29.0.14206865"
  SDL_VERSION: "2.32.10"
  FFMPEG_VERSION: "9.0"

jobs:
  engine-apk:
    name: Engine fork APK (armv7 + arm64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'   # for sdkmanager; gradle daemon installs its pinned JBR 21 itself

    - name: Install Android SDK + NDK
      run: |
        mkdir -p "$HOME/android-sdk/cmdline-tools"
        cd "$HOME/android-sdk"
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMANDLINE_TOOLS_VER}_latest.zip" -O sdk.zip
        unzip -q sdk.zip && mv cmdline-tools cmdtmp && mkdir -p cmdline-tools/tools && mv cmdtmp/* cmdline-tools/tools/
        export ANDROID_HOME="$HOME/android-sdk"
        export PATH="$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "build-tools;${ANDROID_BUILD_TOOLS_VER}" "platform-tools" "platforms;${ANDROID_PLATFORM_VER}" "ndk;${ANDROID_NDK_VERSION}"

    - name: Fetch SDL2 and FFmpeg prebuilts
      run: |
        cd engine
        mkdir -p 3rdparty/SDL 3rdparty/ffmpeg
        wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz" -O- | tar -xz -C 3rdparty/SDL --strip-components=1
        . scripts/lib.sh
        for ABI in armeabi-v7a:arm32 arm64-v8a:arm64; do
          archive=$(GH_CPU_OS=linux GH_CPU_ARCH="${ABI#*:}" FFMPEG_VERSION="${FFMPEG_VERSION}" get_ffmpeg_archive)
          echo "ffmpeg archive: $archive"
          wget -q "https://github.com/FWGS/FFmpeg-Builds/releases/download/latest/${archive}.tar.xz" -O- | tar -xJf - -C 3rdparty/ffmpeg
          mv "3rdparty/ffmpeg/${archive}" "3rdparty/ffmpeg/${ABI%%:*}"
        done

    - name: Init git in engine (gradle reads git hash)
      run: |
        cd engine && git init -q .
        git add -A && git -c user.name=ci -c user.email=ci@half-d.local commit -qm "vendored xash3d-fwgs"

    - name: Build APK
      run: |
        cd engine/android
        ANDROID_HOME="$HOME/android-sdk" ./gradlew assembleContinuous --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: half-D-engine-apk
        path: engine/android/app/build/outputs/apk/continuous/app-continuous.apk

  game-libs:
    name: Diffusion client/server/mainui (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Android NDK
      run: |
        mkdir -p "$HOME/android-sdk/cmdline-tools"
        cd "$HOME/android-sdk"
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMANDLINE_TOOLS_VER}_latest.zip" -O sdk.zip
        unzip -q sdk.zip && mv cmdline-tools cmdtmp && mkdir -p cmdline-tools/tools && mv cmdtmp/* cmdline-tools/tools/
        export ANDROID_HOME="$HOME/android-sdk"
        export PATH="$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platform-tools" "ndk;${ANDROID_NDK_VERSION}"

    - name: Place MainUI subproject
      run: rm -rf game/3rd-party/mainui_cpp && cp -a mainui game/3rd-party/mainui_cpp

    - name: Fetch PhysX SDK
      run: bash scripts/fetch_physx.sh

    - name: Configure (aarch64 Android)
      run: |
        cd game
        export ANDROID_NDK_HOME="$HOME/android-sdk/ndk/${ANDROID_NDK_VERSION}"
        python3 waf configure -T release --android=aarch64,clang,21 --destdir=out

    - name: Build
      run: |
        cd game
        python3 waf build install

    - name: Package diffusion android libs
      run: |
        cd game
        find out -type f -name '*.so' -exec ls -lh {} \;
        mkdir -p pkg/diffusion
        cp -a out/diffusion pkg/ 2>/dev/null || true
        cp -a glsl pkg/diffusion/
        cd pkg && zip -r ../diffusion-android-aarch64-libs.zip diffusion

    - name: Upload game libs artifact
      uses: actions/upload-artifact@v4
      with:
        name: diffusion-android-libs
        path: game/diffusion-android-aarch64-libs.zip
