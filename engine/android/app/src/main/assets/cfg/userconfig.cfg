// half-D launcher config v0.8.4 (auto-applied by the app itself)
//
// Extracted every version bump to <app-files>/gamelibs/<gamedir>/userconfig.cfg,
// which the engine's search hierarchy ranks above the writable game folder —
// so the console exec of userconfig.cfg always applies this patch level.
// User edits to the extracted file survive until the next app update.
//
// Target device: Infinix Hot 50 4G (Helio G100, Mali-G57 MC2, gl4es 1.1.7)
// Evidence: v0.8.3 field report (purple lighting, glitched characters/props,
// 5-8 fps) + the 2026-11-22 engine.log (54/100 custom shaders skipped as
// unusable: no texture_array / shadow_samplers / gpu_shader4 on this driver).
//
// 1. RENDERER: the custom Diffusion shader renderer (gl_diffusion_renderer 1,
//    the v0.7.3 default) is fundamentally incompatible with Mali-G57/gl4es —
//    gl4es's GLSL->GLES translation of the shader set produces wrong output
//    (the purple tint) and over half the permutations can't compile at all.
//    The engine's own renderer (gl_diffusion_renderer 0) is the v0.7.0-proven
//    path on this device: no client shader compiles, upstream-tested batching,
//    correct output at the panel's full speed. This is the v0.8.4 default.
//    To experiment with the custom look on a GPU that exposes the caps:
//    set gl_diffusion_renderer 1 (expect the purple/low-fps state on this one).
gl_diffusion_renderer "0"

// 2. FRAME CAP: the panel runs 1549x680@120; uncapped rendering doubles GPU
//    load and heat on a plastic-chassis budget phone that throttles.
fps_max "60"

// 3. ANISOTROPY: cheapest sampling on Mali-G57 MC2.
gl_anisotropy "1"

// --- The lines below only matter if you re-enable the custom renderer
// --- (gl_diffusion_renderer 1). They tune it for this device; left here
// --- so flipping back is a one-line change with sane defaults.
// GRASS: measured dominant scene cost in the custom renderer — 5128 grass
//   polys vs 494 world at 23 fps (watchdog verdict "detail grass dominates").
r_grass "0"
r_grass_shadows "0"
// SHADER QUEUE: each deferred compile costs ~460 ms through gl4es.
r_shader_lazy_hz "2"
// DECALS: watchdog-flagged scene cost in the custom renderer.
r_decals_ext "0"
