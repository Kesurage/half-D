// half-D launcher config v0.8.7 (auto-applied by the app itself)
//
// Extracted every version bump to <app-files>/gamelibs/<gamedir>/userconfig.cfg,
// which the engine's search hierarchy ranks above the writable game folder —
// so the console exec of userconfig.cfg always applies this patch level.
// User edits to the extracted file survive until the next app update.
//
// Target device: Infinix Hot 50 4G (Helio G100, Mali-G57 MC2)
// v0.8.7 change: default ref back to gl4es. The native ES3 ref failed its
//   fourth field test (v0.8.6: all-black/invisible textures) — the v0.8.1
//   CPU decoder covers only DXT1/3/5, and the game's BC4/BC5/BC6H/BC7 DDS
//   still load as "not found" on native. gl4es loaded every .dds in every
//   build ever fielded and produced the correct look at v0.6.1 semantics —
//   which this config restores (r_shader_lazy_hz 0 = inline first-use).
//   MSAA stays force-off (v0.8.6): the archived gl_msaa 1 + 8x samples
//   was the 3fps/artifacts bomb; the ref clamps it at context setup and
//   repairs the archive.

// 1. RENDERER: the game's own shader renderer, required for correct output.
gl_diffusion_renderer "1"

// 2. SHADER COMPILES: inline first-use — the v0.6.1-correct semantics.
//    (v0.8.0-v0.8.3's budgeted/rate-limited fallbacks drew surfaces with
//    wrong same-family shaders: that was the purple era's real cause.)
r_shader_lazy_hz "0"

// 3. MSAA: OFF — 8x samples was the v0.8.5 3fps/artifacts/crash bomb.
//    (Also force-disabled by the ref itself; kept here for clarity.)
gl_msaa "0"
gl_msaa_samples "0"

// 4. FRAME CAP: the panel runs 1549x680@120; uncapped rendering doubles GPU
//    load and heat on a plastic-chassis budget phone that throttles.
fps_max "60"

// 5. ANISOTROPY: cheapest sampling on Mali-G57 MC2.
gl_anisotropy "1"

// 6. GRASS: measured dominant scene cost — 5128 grass polys vs 494 world
//    at 23 fps (watchdog verdict "detail grass dominates").
r_grass "0"
r_grass_shadows "0"

// 7. DECALS: watchdog-flagged scene cost.
r_decals_ext "0"
