// half-D launcher config v0.8.5 (auto-applied by the app itself)
//
// Extracted every version bump to <app-files>/gamelibs/<gamedir>/userconfig.cfg,
// which the engine's search hierarchy ranks above the writable game folder —
// so the console exec of userconfig.cfg always applies this patch level.
// User edits to the extracted file survive until the next app update.
//
// Target device: Infinix Hot 50 4G (Helio G100, Mali-G57 MC2)
// v0.8.5 changes vs v0.8.4 (which traded the game's look for fps):
//   * gl_diffusion_renderer back to 1 — the v0.8.4 field report proved the
//     engine renderer cannot draw this game (no textures, dead lights,
//     mis-scaled cars). The game's rendering lives in the custom renderer.
//   * r_shader_lazy_hz 0 — the v0.8.4 config forced 2 (two ~460 ms compile
//     stalls per second = the reported "1fps again"). Source default 0 =
//     inline first-use compile. This line also overrides any archived 2.
//   * the launcher now defaults to the native ES3 ref (gles3compat) —
//     gl4es's GLSL translation caused the purple lighting/glitched models
//     and the ~460 ms compiles. Fallback: "-ref gl4es" in launcher args.

// 1. RENDERER: the game's own shader renderer, required for correct output.
gl_diffusion_renderer "1"

// 2. SHADER COMPILES: inline first-use (reference behavior, always correct).
//    On the native ES3 ref compiles are fast and cached; no rate limiting.
r_shader_lazy_hz "0"

// 3. FRAME CAP: the panel runs 1549x680@120; uncapped rendering doubles GPU
//    load and heat on a plastic-chassis budget phone that throttles.
fps_max "60"

// 4. ANISOTROPY: cheapest sampling on Mali-G57 MC2.
gl_anisotropy "1"

// 5. GRASS: measured dominant scene cost — 5128 grass polys vs 494 world
//    at 23 fps (watchdog verdict "detail grass dominates").
r_grass "0"
r_grass_shadows "0"

// 6. DECALS: watchdog-flagged scene cost.
r_decals_ext "0"
