// half-D launcher config v0.8.2 (auto-applied by the app itself)
//
// Extracted every version bump to <app-files>/gamelibs/<gamedir>/userconfig.cfg,
// which the engine's search hierarchy ranks above the writable game folder —
// so the console exec of userconfig.cfg always applies this patch level.
// User edits to the extracted file survive until the next app update.
//
// Target device: Infinix Hot 50 4G (Helio G100, Mali-G57 MC2)
// Evidence: engine.log 2026-11-22 20:59 session (v0.8.1 field log)
//
// 1. GRASS: measured dominant scene cost — 5128 grass polys vs 494 world
//    polys in the menu map at 23 fps (watchdog verdict "detail grass
//    dominates"). Off; the menu map skips grass entirely in v0.8.2.
r_grass "0"
r_grass_shadows "0"
// Want some ground cover instead? Delete the two lines above and set:
// r_grass "1"
// r_grass_fade_start "256"
// r_grass_fade_dist "512"

// 2. SHADER QUEUE: each deferred compile costs ~460 ms through gl4es and
//    drains at 1/s by default (the 8 fps windows after map loads).
//    2/s halves the drain time without raising spike risk.
r_shader_lazy_hz "2"

// 3. DECALS: watchdog-flagged scene cost.
r_decals_ext "0"

// 4. FRAME CAP: the panel runs 1549x680@120; uncapped rendering doubles
//    GPU load and heat on a plastic-chassis budget phone that throttles.
fps_max "60"

// 5. ANISOTROPY: cheapest sampling on Mali-G57 MC2.
gl_anisotropy "1"
